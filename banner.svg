<svg viewBox="0 0 800 160" xmlns="http://www.w3.org/2000/svg" width="100%" height="160">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="fsBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a051b">
        <animate attributeName="stop-color" values="#0a051b;#1a0a3a;#081b3b;#0a051b" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#160c33">
        <animate attributeName="stop-color" values="#160c33;#0d2a4a;#230c45;#160c33" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#07152b">
        <animate attributeName="stop-color" values="#07152b;#25073f;#07152b" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Crisp Text Gradient -->
    <linearGradient id="fsTextGrad" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#ff416c">
        <animate attributeName="offset" values="-1;2" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="25%" stop-color="#ff4b2b">
        <animate attributeName="offset" values="-0.75;2.25" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#f7b731">
        <animate attributeName="offset" values="-0.5;2.5" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="75%" stop-color="#0fbcf9">
        <animate attributeName="offset" values="-0.25;2.75" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a55eea">
        <animate attributeName="offset" values="0;3" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <pattern id="fsGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>

    <!-- Floating Star Shape -->
    <polygon id="fsStar" points="0,-4 1,-1 4,0 1,1 0,4 -1,1 -4,0 -1,-1" fill="#ffffff"/>
  </defs>

  <!-- Card Frame -->
  <rect width="800" height="160" rx="16" fill="url(#fsBgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  <rect width="800" height="160" rx="16" fill="url(#fsGrid)"/>

  <!-- Subtle Corner Stars -->
  <use href="#fsStar" x="100" y="30" opacity="0.6"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/></use>
  <use href="#fsStar" x="700" y="35" opacity="0.6"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.5s" repeatCount="indefinite"/></use>
  <use href="#fsStar" x="120" y="130" opacity="0.5"><animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/></use>
  <use href="#fsStar" x="680" y="125" opacity="0.5"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.5s" repeatCount="indefinite"/></use>

  <!-- 100% Crisp Title Text with Zero Glow Filter -->
  <text x="400" y="72" text-anchor="middle" fill="url(#fsTextGrad)" font-family="'Segoe UI', Ubuntu, Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="4">
    ⚡ FREE-STUFF ⚡
  </text>

  <!-- Crisp Subtitle -->
  <text x="400" y="105" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Ubuntu, Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="1.5" opacity="0.9">
    Download Anything. From Anywhere. 100% Free.
  </text>

  <!-- Bottom Accent Bar -->
  <rect x="260" y="124" width="280" height="3" rx="1.5" fill="url(#fsTextGrad)"/>
</svg>
